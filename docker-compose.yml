# DeepResearch Agent 编排
services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file: .env
    command: ["python", "mcp_servers/research_server.py"]
    ports:
      - "9000:9000"
    restart: unless-stopped

